<!DOCTYPE html>
<html>
	<head>
		<title>Arithmetic Game</title>
		<script src='script/main.js' type='module'></script>
		<link rel='stylesheet' href='./style/main.css'>
	</head>
	<body>
		<canvas id='game-canvas' width='800' height='600' tabindex='0'></canvas>
		<!--<p>&#x5500;</p>-->
		<div id='num-delete'>
			<p>Numpad:</p>
			<table id='numpad' class='hunimal-font'></table>
			<button id='delete'>Delete</button><br>
			<button id='changeMusic'>Change Song</button>
			<button id='stopMusic'>Stop Music</button><br>
			<button id='changeBackground'>Change Background</button>
			<p>Question types:</p>
			<input type='checkbox' name='add' id='addCb' checked/>Addition<br>
			<input type='checkbox' name='sub' id='subCb'/>Subtraction<br>
			<input type='checkbox' name='mult' id='multCb' checked/>Multiplication<br>
			<input type='checkbox' name='div' id='divCb'/>Division<br>
			<p>Addition type:</p>
			<input type='radio' name='addition-type' id='add-one'/>One humber addition<br>
			<input type='radio' name='addition-type' id='add-two' checked/>Two humber addition<br>
			<input type='radio' name='addition-type' id='add-three'/>Three humber addition<br>
		</div>
		<div id='choices-div'>
			<p>Multiplication ranges:</p>
			<table id='multchoice' class='hunimal-font'></table>
			<button id='clearAllChoices'>Clear All</button>
			<button id='setAllChoices'>Set All</button><br>
			<input type='checkbox' name='mult-two-digits' id='mult-two-digits'/>
			<label for='mult-two-digits'>Two digits in multiplication</label>
			<div id='mult-two-digits-opts' class='hunimal-font' style='display: none;'>
				<label for='num1min'>Num 1 min</label>
				<input type='range' name='num1min' id='num1min' min=0 max=9999 value=0 step=100>
				<span id='num1min-disp'>0</span>
				<br>
				<label for='num1max'>Num 1 max</label>
				<input type='range' name='num1max' id='num1max' min=0 max=9999 value=9900 step=100>
				<span id='num1max-disp'>0</span>
				<br>
				<label for='num2min'>Num 2 min</label>
				<input type='range' name='num2min' id='num2min' min=0 max=9999 value=0 step=100>
				<span id='num2min-disp'>0</span>
				<br>
				<label for='num2max'>Num 2 max</label>
				<input type='range' name='num2max' id='num2max' min=0 max=9999 value=9900 step=100>
				<span id='num2max-disp'>0</span>
			</div>
		</div>
	</body>
</html>
